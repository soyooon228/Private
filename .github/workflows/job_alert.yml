name: 공공기관 채용정보 알림
on:
  schedule:
    # 한국시간(KST) 기준 매일 09:00, 18:00 실행
    # GitHub Actions는 UTC 기준이라 KST-9시간으로 계산: 09:00 KST = 00:00 UTC, 18:00 KST = 09:00 UTC
    - cron: "0 0 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # 깃허브 화면에서 수동으로 "지금 실행"도 가능하게 함
permissions:
  contents: write   # seen_jobs.json 변경사항을 저장소에 다시 커밋하기 위해 필요
jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4
      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt
      - name: 채용정보 확인 및 슬랙 알림 전송
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          CALENDAR_ID: ${{ secrets.CALENDAR_ID }}
        run: python job_alert.py
      - name: 알림 발송 기록(seen_jobs.json, calendar_jobs.json) 저장소에 반영
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain seen_jobs.json calendar_jobs.json)" ]; then
            git add seen_jobs.json calendar_jobs.json
            git commit -m "chore: 확인한 공고 목록 업데이트 [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "변경 사항 없음"
          fi
