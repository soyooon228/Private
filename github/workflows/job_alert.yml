name: 공공기관 채용정보 알림

on:
  schedule:
    # 한국시간(KST) 기준 매일 09:00, 18:00 실행
    - cron: "0 0 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 패키지 설치
        run: pip install -r requirements.txt

      - name: 채용정보 확인 및 슬랙 알림 전송
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python job_alert.py

      - name: 알림 발송 기록(seen_jobs.json) 저장소에 반영
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain seen_jobs.json)" ]; then
            git add seen_jobs.json
            git commit -m "chore: 확인한 공고 목록 업데이트 [skip ci]"
            git push
          else
            echo "변경 사항 없음"
          fi
